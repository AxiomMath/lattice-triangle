# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "LatticeTriangle"
  authors: [Kenny Lau]
  description: >
    `LatticeTriangle` is a formal proof of the analytic engine behind the paucity of lattice
    triangles. For $\eta \in (0, 1/6)$ and $\theta \in (0, 1)$, it proves that the proportion of
    pairs $(p, q)$ in the truncated obtuse region $H_n(\eta)$ satisfying
    $\gcd(q, P^+(n)) = 1$ and $S(p, q) < 5$ tends to $0$ as $n \to \infty$ along those $n$ with
    $P^+(n) \ge n^\theta$, where $P^+(n)$ is the largest prime factor of $n$ and
    $S(p, q) = \#\{a \in (\mathbb{Z}/n)^\times : ap \in I_{2p-1},\ aq \in I_{2q-1}\}$.
    The Lean files were generated by AxiomProver, Axiom Math's in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "MIT"

repository:
  role: "substantive-development"

sources:
  - title: "On the paucity of lattice triangles"
    authors: [David Kurniadi Angdinata, Evan Chen, Ken Ono, Jiaxin Zhang, Jujian Zhang]
    id: "https://arxiv.org/abs/2603.23928"
    type: "article"
    location: "Theorem 6.1 (Analytic engine: a lower bound for $S(p,q)$)"
    relationship: "formalizes"
    note: >
      Section 6 of the paper documents this repository and delimits what was formalized.

classification:
  arxiv: [math.DS, math.CO, math.NT]
  msc2020: [37E35, 30F60]

status:
  scope: >
    Theorem 6.1, which the paper calls the main engine, for all $\eta \in (0, 1/6)$ and
    $\theta \in (0, 1)$. `problem.lean` states it as a self-contained analytic claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "analyticEngine_lower_bound"
    file: "LatticeTriangle/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]
      prompting_notes: >
        The paper records that AxiomProver was given a natural language statement and an informal
        proof. The repository's `input/` holds both: `problem.tex` and `informal_proof.tex`, the
        latter a draft by K. Ono that the README notes contained some correctable mistakes.

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal problem statement in `LatticeTriangle/problem.lean` was checked against the source
    paper by an author of that paper.

alignment:
  statements:
    - source: "Theorem 6.1: $\\lim_{n \\to \\infty,\\, P^+(n) \\ge n^\\delta} \\frac{\\#\\{(p,q) \\in H_n(\\varepsilon) \\,:\\, \\gcd(q, P^+(n)) = 1 \\text{ and } S(p,q) < 5\\}}{\\#H_n(\\varepsilon)} = 0$"
      lean: "analyticEngine_lower_bound"
      module: "LatticeTriangle.solution"
      status: >
        Proved, with the limit written out as an $\varepsilon$-$N_0$ statement rather than as a
        limit. The parameters are renamed: the paper's $\varepsilon$ and $\delta$ are `η` and `θ`
        in Lean, where `ε` is instead the limit's tolerance.
