name = "LatticeTriangle"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LatticeTriangle"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "LatticeTriangle"
globs = ["LatticeTriangle.+"]
